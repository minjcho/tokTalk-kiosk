openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Voice Kiosk café ordering API
servers:
  - url: /api
paths:
  /staff/me:
    get:
      operationId: getStaffMe
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Authenticated and explicitly approved staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffIdentity" }
        "401": { $ref: "#/components/responses/StaffUnauthorized" }
        "403": { $ref: "#/components/responses/StaffForbidden" }
        "503": { $ref: "#/components/responses/StaffUnavailable" }
  /staff/orders:
    get:
      operationId: listStaffOrders
      security: [{ staffSession: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, preparing, completed] }
        - name: before
          in: query
          description: Exclusive order-number cursor returned as nextCursor
          schema: { type: string, pattern: "^[0-9]{1,19}$" }
      responses:
        "200":
          description: Latest 50 confirmed orders; never includes session capabilities or conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrderList" }
        "400": { $ref: "#/components/responses/StaffInvalidInput" }
        "401": { $ref: "#/components/responses/StaffUnauthorized" }
        "403": { $ref: "#/components/responses/StaffForbidden" }
        "503": { $ref: "#/components/responses/StaffUnavailable" }
  /staff/orders/{orderNumber}/status:
    patch:
      operationId: updateStaffOrderStatus
      security: [{ staffSession: [] }]
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{1,19}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffOrderStatusInput" }
      responses:
        "200":
          description: Persisted fulfillment state and timestamps; payment remains out of scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrder" }
        "400": { $ref: "#/components/responses/StaffInvalidInput" }
        "401": { $ref: "#/components/responses/StaffUnauthorized" }
        "403": { $ref: "#/components/responses/StaffForbidden" }
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffError" }
        "409":
          description: Stale version or invalid transition; reload the order list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffError" }
        "503": { $ref: "#/components/responses/StaffUnavailable" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /kiosk/menu:
    get:
      operationId: getMenu
      responses:
        "200":
          description: Validated café menu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }
  /kiosk/status:
    get:
      operationId: getKioskStatus
      responses:
        "200":
          description: AI availability and session settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KioskStatus" }
  /kiosk/sessions:
    post:
      operationId: createSession
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "201":
          description: New independent shared order session; expires after 180 seconds without input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
  /kiosk/sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session; reading does not extend idle timeout or restore a previous customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
    delete:
      operationId: cancelSession
      responses:
        "204": { description: Session and customer context removed; confirmed orders are retained }
  /kiosk/sessions/{sessionId}/speech:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: speakClarification
      description: Reads only the current server-owned clarification. Audio is transient, never stored, and uses the shared AI request quota.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClarificationSpeechInput" }
      responses:
        "200":
          description: AI-generated Korean speech; Cache-Control no-store
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400":
          description: Invalid speech request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KioskError" }
        "409": { $ref: "#/components/responses/SessionConflict" }
        "410": { $ref: "#/components/responses/SessionExpired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: Speech generation failed; touch ordering remains available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KioskError" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /kiosk/sessions/{sessionId}/guidance-speech:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: speakGuidance
      description: Reads a server-approved Korean start or recovery guide by code, never client text. Requires an active idle session at the supplied revision. Uses the shared AI quota and transient audio only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuidanceSpeechInput" }
      responses:
        "200":
          description: Transient Korean guidance; Cache-Control no-store, private
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400":
          description: Unknown guidance code or invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KioskError" }
        "409": { $ref: "#/components/responses/SessionConflict" }
        "410": { $ref: "#/components/responses/SessionExpired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: Guidance audio failed; screen ordering remains available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KioskError" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /kiosk/sessions/{sessionId}/text:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitTextOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextOrderInput" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "200":
          description: AI-parsed order or a clarification; never checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResult" }
  /kiosk/sessions/{sessionId}/activity:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: touchSession
      responses:
        "200":
          description: Extend timeout only on a real customer interaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
  /kiosk/sessions/{sessionId}/voice:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitVoiceOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceOrderInput" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "200":
          description: Transcription, AI extraction and server-validated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResult" }
  /kiosk/sessions/{sessionId}/items:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemInput" }
      responses:
        "200":
          description: Cart with touch-added item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
  /kiosk/sessions/{sessionId}/items/{itemId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: itemId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemUpdate" }
      responses:
        "200":
          description: Cart with modified quantity or options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
    delete:
      operationId: removeCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderConfirmationInput" }
      responses:
        "200":
          description: Cart without the item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
  /kiosk/sessions/{sessionId}/confirm:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderConfirmationInput" }
      responses:
        "200":
          description: Persisted simulated order; same receipt on retries within the session timeout; no payment or staff fulfillment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderReceipt" }
        "409": { $ref: "#/components/responses/SessionConflict" }
        "410": { $ref: "#/components/responses/SessionExpired" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /kiosk/sessions/{sessionId}/debug:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSessionDebug
      responses:
        "200":
          description: Only this customer's STT, structured JSON and safe error logs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDebug" }
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk-verified session AND active server-managed kiosk_staff membership required. Anonymous kiosk sessions never authorize staff access.
  responses:
    TooManyRequests:
      description: Shared per-peer quota of 30 session creations, new AI submissions or question/guidance speech generations per 60 seconds; completed requestId replays and browser-cached audio replays do not consume quota
      headers:
        Retry-After:
          description: Seconds until the current window ends; use touch ordering in the meantime
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KioskError" }
    StaffUnauthorized:
      description: No valid Clerk session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffError" }
    StaffForbidden:
      description: Account not approved as staff, or cross-site request rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffError" }
    StaffInvalidInput:
      description: Invalid parameters or body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffError" }
    StaffUnavailable:
      description: Staff storage or authentication is unavailable; access denied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffError" }
    SessionConflict:
      description: Session is busy, closed or has a different revision; reload the current cart
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KioskError" }
    SessionExpired:
      description: Session expired or was cancelled; start a new independent session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KioskError" }
    StorageUnavailable:
      description: Storage unavailable; no success receipt is issued before the order is committed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KioskError" }
  schemas:
    GuidanceSpeechInput:
      type: object
      additionalProperties: false
      required: [revision, guide]
      properties:
        revision: { type: integer, minimum: 0 }
        guide:
          type: string
          enum: [welcome, no-speech, too-short, mic-denied, mic-unavailable, recognition-failed]
    ClarificationSpeechInput:
      type: object
      required: [revision, question]
      properties:
        revision: { type: integer, minimum: 0 }
        question: { type: string, minLength: 1, maxLength: 2000 }
        speed:
          type: string
          enum: [slow, normal]
          default: normal
          description: Allowlisted reading pace; slow is 0.8x and normal is 1x. Omission uses normal for existing clients.
    StaffIdentity:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    StaffError:
      type: object
      required: [code, error]
      properties:
        code: { type: string }
        error: { type: string }
    StaffOrder:
      type: object
      required: [orderNumber, items, total, itemCount, confirmedAt, status, version, preparationStartedAt, fulfilledAt]
      properties:
        orderNumber: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        total: { type: integer }
        itemCount: { type: integer }
        confirmedAt: { type: string }
        status: { type: string, enum: [pending, preparing, completed] }
        version: { type: integer, minimum: 0 }
        preparationStartedAt: { type: ["string", "null"] }
        fulfilledAt: { type: ["string", "null"] }
    StaffOrderList:
      type: object
      required: [orders, nextCursor]
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/StaffOrder" } }
        nextCursor: { type: ["string", "null"] }
    StaffOrderStatusInput:
      type: object
      additionalProperties: false
      required: [status, expectedVersion]
      properties:
        status: { type: string, enum: [preparing, completed] }
        expectedVersion: { type: integer, minimum: 0, maximum: 2147483646 }
    KioskError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    MenuOption:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
    MenuSize:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
    MenuItem:
      type: object
      required: [menuId, name, englishName, description, category, price, availableTemperatures, availableSizes, availableOptions, aliases, defaultTemperature, image]
      properties:
        menuId: { type: string }
        name: { type: string }
        englishName: { type: string }
        description: { type: string }
        category: { type: string, enum: [coffee, non-coffee] }
        price: { type: integer }
        availableTemperatures: { type: array, items: { type: string, enum: [ice, hot] } }
        availableSizes: { type: array, items: { $ref: "#/components/schemas/MenuSize" } }
        availableOptions: { type: array, items: { $ref: "#/components/schemas/MenuOption" } }
        aliases: { type: array, items: { type: string } }
        defaultTemperature: { type: string, enum: [ice, hot] }
        image: { type: string }
    KioskStatus:
      type: object
      required: [aiReady, transcriptionModel, parserModel, idleTimeoutSeconds]
      properties:
        aiReady: { type: boolean }
        transcriptionModel: { type: string }
        parserModel: { type: string }
        idleTimeoutSeconds: { type: integer }
    CartItem:
      type: object
      required: [id, menuId, name, quantity, temperature, size, options, unitPrice, lineTotal]
      properties:
        id: { type: string }
        menuId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        temperature: { type: string, enum: [ice, hot] }
        size: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/MenuOption" } }
        unitPrice: { type: integer }
        lineTotal: { type: integer }
    OrderSession:
      type: object
      required: [id, revision, status, items, total, itemCount, expiresAt, lastTranscript, clarification]
      properties:
        id: { type: string }
        revision: { type: integer }
        status: { type: string, enum: [active, completed, cancelled] }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        total: { type: integer }
        itemCount: { type: integer }
        expiresAt: { type: string }
        lastTranscript: { type: ["string", "null"] }
        clarification: { type: ["string", "null"] }
    TextOrderInput:
      type: object
      required: [text, revision, requestId]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        revision: { type: integer, minimum: 0 }
        requestId: { type: string, minLength: 1, maxLength: 100 }
    VoiceOrderInput:
      type: object
      required: [audioBase64, mimeType, revision, requestId]
      properties:
        audioBase64: { type: string, minLength: 1, maxLength: 14000000 }
        mimeType: { type: string, enum: [audio/wav, audio/webm, audio/mp4, audio/ogg] }
        revision: { type: integer, minimum: 0 }
        requestId: { type: string, minLength: 1, maxLength: 100 }
    CartItemInput:
      type: object
      required: [menuId, quantity, temperature, size, options, revision]
      properties:
        menuId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        temperature: { type: string, enum: [ice, hot] }
        size: { type: string }
        options: { type: array, items: { type: string } }
        revision: { type: integer, minimum: 0 }
    CartItemUpdate:
      type: object
      required: [quantity, temperature, size, options, revision]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20 }
        temperature: { type: string, enum: [ice, hot] }
        size: { type: string }
        options: { type: array, items: { type: string } }
        revision: { type: integer, minimum: 0 }
    OrderConfirmationInput:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
    OrderResult:
      type: object
      required: [session, transcript, message, needsClarification, extractedJson]
      properties:
        session: { $ref: "#/components/schemas/OrderSession" }
        transcript: { type: string }
        message: { type: string }
        needsClarification: { type: boolean }
        extractedJson: { type: string }
        uiAction:
          type: string
          enum: [show_menu, close_menu]
          description: Optional display-only command to show or close the menu; never changes the cart, order draft or a pending clarification. Absent on older responses.
    OrderReceipt:
      type: object
      required: [orderNumber, items, total, itemCount, completedAt]
      properties:
        orderNumber: { type: string, description: Globally unique database-issued decimal number; at least six digits and never wrapped }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        total: { type: integer }
        itemCount: { type: integer }
        completedAt: { type: string }
    DebugEvent:
      type: object
      required: [time, level, code, message]
      properties:
        time: { type: string }
        level: { type: string, enum: [info, error] }
        code: { type: string }
        message: { type: string }
    SessionDebug:
      type: object
      required: [transcript, extractedJson, events]
      properties:
        transcript: { type: ["string", "null"] }
        extractedJson: { type: ["string", "null"] }
        events: { type: array, items: { $ref: "#/components/schemas/DebugEvent" } }
