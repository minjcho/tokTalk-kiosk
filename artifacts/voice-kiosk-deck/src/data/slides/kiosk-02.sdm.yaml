format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
assets:
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
  americano:
    src: images/americano.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: NAME & IDEA
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 터치에서 대화로, 톡톡
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 02 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: summaryPanel
    type: shape
    frame:
      x: 120
      y: 325
      width: 1320
      height: 550
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: surface
      opacity: 1
  - id: summaryPanelStrip
    type: shape
    frame:
      x: 120
      y: 325
      width: 1320
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: summary
    type: text
    frame:
      x: 160
      y: 375
      width: 1240
      height: 470
    body:
      paragraphs:
        - runs:
            - text: "첫 번째 톡: 화면을 터치하는 소리"
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 24
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: "두 번째 톡: 말로 대화하는 Talk"
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 24
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: "아이디어: 터치 중심 주문에 대화 입력을 더하기"
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 24
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: 말한 주문은 화면으로 확인하고 터치로 확정
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 24
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: 결제 대신 모의 주문번호 발급·확정 주문 보관
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 24
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
  - id: sideField
    type: shape
    frame:
      x: 1480
      y: 325
      width: 320
      height: 550
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: soft
      opacity: 1
  - id: sideFieldStrip
    type: shape
    frame:
      x: 1480
      y: 325
      width: 320
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: heroWord
    type: text
    frame:
      x: 1480
      y: 380
      width: 320
      height: 195
    body:
      paragraphs:
        - runs:
            - text: 톡톡
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 64
            color:
              kind: token
              token: accent
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 10
  - id: coffee
    type: image
    frame:
      x: 1510
      y: 570
      width: 260
      height: 290
    assetId: americano
    fit: contain
