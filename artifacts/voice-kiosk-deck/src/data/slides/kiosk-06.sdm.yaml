format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
assets:
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
  americano:
    src: images/americano.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: VOICE ORDERING
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 누르고 말하는 음성 주문
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 06 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: startPanel
    type: shape
    frame:
      x: 120
      y: 410
      width: 820
      height: 250
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 0.07
  - id: startPanelStrip
    type: shape
    frame:
      x: 120
      y: 410
      width: 820
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: stopPanel
    type: shape
    frame:
      x: 980
      y: 410
      width: 820
      height: 250
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: green
      opacity: 0.07
  - id: stopPanelStrip
    type: shape
    frame:
      x: 980
      y: 410
      width: 820
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: green
      opacity: 1
  - id: startLabel
    type: text
    frame:
      x: 120
      y: 320
      width: 820
      height: 65
    body:
      paragraphs:
        - runs:
            - text: 첫 번째 터치
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: accent
            weight: 700
          lineHeight: 1.2
          spaceAfterPt: 0
  - id: startLabelRule
    type: shape
    frame:
      x: 120
      y: 390
      width: 80
      height: 4
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: stopLabel
    type: text
    frame:
      x: 980
      y: 320
      width: 820
      height: 65
    body:
      paragraphs:
        - runs:
            - text: 두 번째 터치
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: accent
            weight: 700
          lineHeight: 1.2
          spaceAfterPt: 0
  - id: stopLabelRule
    type: shape
    frame:
      x: 980
      y: 390
      width: 80
      height: 4
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: start
    type: text
    frame:
      x: 160
      y: 450
      width: 725
      height: 170
    body:
      paragraphs:
        - runs:
            - text: 마이크 녹음 시작
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 10
  - id: stop
    type: text
    frame:
      x: 1020
      y: 450
      width: 735
      height: 170
    body:
      paragraphs:
        - runs:
            - text: |-
                녹음 종료 후
                음성 인식·주문 분석
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 10
  - id: feedback
    type: text
    frame:
      x: 120
      y: 700
      width: 1680
      height: 190
    body:
      paragraphs:
        - runs:
            - text: 인식된 말씀과 처리 상태를 화면에 표시
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 23
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 12
          bullet:
            kind: character
            character: •
        - runs:
            - text: 마이크 권한·무음·처리 오류는 안내 후 재시도
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 23
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 12
          bullet:
            kind: character
            character: •
  - id: notStreaming
    type: text
    frame:
      x: 120
      y: 930
      width: 1680
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 상시 청취나 실시간 스트리밍 방식은 아님
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
