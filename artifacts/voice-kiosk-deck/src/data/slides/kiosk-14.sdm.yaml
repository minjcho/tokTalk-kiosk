format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
assets:
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
  americano:
    src: images/americano.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: SESSION & ORDER DATA
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 대화는 초기화, 주문은 보관
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 14 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: temporaryPanel
    type: shape
    frame:
      x: 120
      y: 330
      width: 805
      height: 495
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: surface
      opacity: 1
  - id: temporaryPanelStrip
    type: shape
    frame:
      x: 120
      y: 330
      width: 805
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: durablePanel
    type: shape
    frame:
      x: 985
      y: 330
      width: 815
      height: 495
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: green
      opacity: 0.07
  - id: durablePanelStrip
    type: shape
    frame:
      x: 985
      y: 330
      width: 815
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: green
      opacity: 1
  - id: temporaryContext
    type: text
    frame:
      x: 160
      y: 375
      width: 725
      height: 415
    body:
      paragraphs:
        - runs:
            - text: |-
                취소·완료·180초 무입력 시
                고객 대화 문맥 정리
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 21
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                새 방문에서 이전 고객 주문을
                자동 복원하지 않음
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 21
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                업로드 음성은 요청 처리 중에만
                사용하고 보관하지 않음
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 21
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
  - id: durableReceipt
    type: text
    frame:
      x: 1025
      y: 375
      width: 735
      height: 415
    body:
      paragraphs:
        - runs:
            - text: |-
                확정 품목·옵션·가격·합계는
                PostgreSQL에 별도 보관
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: green
            weight: 700
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                API 서버 재시작 후에도
                확정 주문 유지
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: green
            weight: 700
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
  - id: storageSource
    type: text
    frame:
      x: 120
      y: 930
      width: 1680
      height: 60
    body:
      paragraphs:
        - runs:
            - text: "기준: 현재 세션·주문 저장 구현 · 2026.10.14"
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
