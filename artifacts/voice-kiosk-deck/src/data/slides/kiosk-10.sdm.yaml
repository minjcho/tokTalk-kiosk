format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
assets:
  americano:
    src: images/americano.jpg
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: CONTEXTUAL CORRECTION
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 말로 수정하는 주문
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 10 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: quantityPanel
    type: shape
    frame:
      x: 120
      y: 345
      width: 600
      height: 360
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 0.07
  - id: quantityPanelStrip
    type: shape
    frame:
      x: 120
      y: 345
      width: 600
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: quantityChange
    type: text
    frame:
      x: 155
      y: 395
      width: 530
      height: 280
    body:
      paragraphs:
        - runs:
            - text: 3 → 2
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 88
            color:
              kind: token
              token: accent
            weight: 700
          align: center
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: correctionStory
    type: text
    frame:
      x: 740
      y: 345
      width: 1060
      height: 380
    body:
      paragraphs:
        - runs:
            - text: "데모 시작: 라떼 3잔 중 1잔에 샷 추가"
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
        - runs:
            - text: "추가 발화: “아니 세 잔 말고 두 잔이요”"
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                반영 결과: 기본 라떼 1잔 +
                샷 추가 라떼 1잔
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
  - id: preservedOption
    type: text
    frame:
      x: 120
      y: 755
      width: 1680
      height: 170
    body:
      paragraphs:
        - runs:
            - text: 수량은 줄이고 한 잔에 지정한 옵션은 유지
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 23
            color:
              kind: token
              token: green
            weight: 700
          lineHeight: 1.3
          spaceAfterPt: 12
