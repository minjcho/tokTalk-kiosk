format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
assets:
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
  americano:
    src: images/americano.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: VALIDATION
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 모호한 요청은 다시 확인
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 11 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: clarificationPanel
    type: shape
    frame:
      x: 120
      y: 340
      width: 760
      height: 515
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: soft
      opacity: 1
  - id: clarificationPanelStrip
    type: shape
    frame:
      x: 120
      y: 340
      width: 760
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: clarification
    type: text
    frame:
      x: 160
      y: 410
      width: 680
      height: 330
    body:
      paragraphs:
        - runs:
            - text: |-
                메뉴·수정 대상이
                불분명하면
                추가 확인
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 34
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: guardrails
    type: text
    frame:
      x: 980
      y: 340
      width: 820
      height: 515
    body:
      paragraphs:
        - runs:
            - text: 확인이 필요한 동안 장바구니는 유지
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                등록되지 않은 메뉴나
                지원하지 않는 옵션은 반영하지 않음
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                옵션 충돌·수량·가격은
                서버에서 다시 검증
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                주문 확정은 음성 해석만으로
                실행하지 않음
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
