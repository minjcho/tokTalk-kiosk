format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
assets:
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
  americano:
    src: images/americano.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: TARGET CUSTOMERS
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 톡톡이 필요한 고객
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 04 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: operatorPanel
    type: shape
    frame:
      x: 120
      y: 410
      width: 820
      height: 550
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 0.07
  - id: operatorPanelStrip
    type: shape
    frame:
      x: 120
      y: 410
      width: 820
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: visitorPanel
    type: shape
    frame:
      x: 980
      y: 410
      width: 820
      height: 550
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: surface
      opacity: 1
  - id: visitorPanelStrip
    type: shape
    frame:
      x: 980
      y: 410
      width: 820
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: targetLabel
    type: text
    frame:
      x: 120
      y: 320
      width: 820
      height: 65
    body:
      paragraphs:
        - runs:
            - text: 주요 이용 대상
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: accent
            weight: 700
          lineHeight: 1.2
          spaceAfterPt: 0
  - id: targetLabelRule
    type: shape
    frame:
      x: 120
      y: 390
      width: 80
      height: 4
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: operator
    type: text
    frame:
      x: 160
      y: 450
      width: 740
      height: 410
    body:
      paragraphs:
        - runs:
            - text: |-
                고령층과
                키오스크 조작이
                익숙하지 않은 고객
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 34
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: visitors
    type: text
    frame:
      x: 1020
      y: 450
      width: 735
      height: 410
    body:
      paragraphs:
        - runs:
            - text: |-
                함께 고려할 고객:
                일상어·사투리로
                주문하는 고객
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 23
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 12
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                함께 고려할 상황:
                동행인과 번갈아
                말하는 주문
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 23
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 12
          bullet:
            kind: character
            character: •
