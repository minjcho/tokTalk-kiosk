format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
assets:
  americano:
    src: images/americano.jpg
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: CONFIRMATION
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 주문 확정은 마지막 터치로
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 13 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: confirmationSteps
    type: text
    frame:
      x: 120
      y: 360
      width: 1010
      height: 430
    body:
      paragraphs:
        - runs:
            - text: |-
                주문 확인 화면에서
                품목·옵션·수량·합계 검토
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
        - runs:
            - text: 고객의 최종 터치 후 주문 저장
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
        - runs:
            - text: 저장된 주문에 모의 주문번호 발급
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.3
          spaceAfterPt: 14
          bullet:
            kind: character
            character: •
  - id: boundaryPanel
    type: shape
    frame:
      x: 1220
      y: 330
      width: 580
      height: 376
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: green
      opacity: 1
  - id: failure
    type: text
    frame:
      x: 1260
      y: 405
      width: 500
      height: 220
    body:
      paragraphs:
        - runs:
            - text: |-
                저장 실패 시
                성공한 주문처럼
                안내하지 않음
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: background
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 10
