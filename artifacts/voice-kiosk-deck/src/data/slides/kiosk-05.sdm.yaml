format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
assets:
  americano:
    src: images/americano.jpg
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: PROBLEM HYPOTHESIS
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 말로 주문하는 새로운 방법
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 05 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: hypothesisPanel
    type: shape
    frame:
      x: 120
      y: 410
      width: 820
      height: 550
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: soft
      opacity: 1
  - id: hypothesisPanelStrip
    type: shape
    frame:
      x: 120
      y: 410
      width: 820
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: approachPanel
    type: shape
    frame:
      x: 980
      y: 410
      width: 820
      height: 550
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: surface
      opacity: 1
  - id: approachPanelStrip
    type: shape
    frame:
      x: 980
      y: 410
      width: 820
      height: 6
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: hypothesisLabel
    type: text
    frame:
      x: 120
      y: 320
      width: 820
      height: 65
    body:
      paragraphs:
        - runs:
            - text: 문제 가설
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 26
            color:
              kind: token
              token: accent
            weight: 700
          lineHeight: 1.2
          spaceAfterPt: 0
  - id: hypothesisLabelRule
    type: shape
    frame:
      x: 120
      y: 390
      width: 80
      height: 4
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: hypothesis
    type: text
    frame:
      x: 160
      y: 450
      width: 740
      height: 410
    body:
      paragraphs:
        - runs:
            - text: |-
                작은 글씨와
                여러 선택 단계가
                주문 입력을
                어렵게 할 수 있음
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 34
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 10
  - id: approach
    type: text
    frame:
      x: 1020
      y: 450
      width: 735
      height: 410
    body:
      paragraphs:
        - runs:
            - text: |-
                접근: 큰 마이크 버튼과
                읽기 쉬운 화면
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                고객이 익숙한 표현으로
                원하는 음료를 전달
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: |-
                말하기가 어렵거나
                인식이 불확실하면 터치로 전환
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
