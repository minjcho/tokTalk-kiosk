format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
theme:
  colors:
    background: "#FBF6EE"
    foreground: "#291F19"
    surface: "#FFFFFF"
    muted: "#6B5F57"
    accent: "#EC4613"
    green: "#22774F"
    border: "#E2D8CB"
    soft: "#F5F1EA"
  fonts:
    display: IBM Plex Sans KR
    body: IBM Plex Sans KR
background:
  kind: solid
  color:
    kind: token
    token: background
  opacity: 1
assets:
  kiosk:
    src: images/kiosk-current.jpg
  latte:
    src: images/cafe-latte.jpg
  americano:
    src: images/americano.jpg
elements:
  - id: edgeBar
    type: shape
    frame:
      x: 0
      y: 0
      width: 18
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: topRule
    type: shape
    frame:
      x: 120
      y: 128
      width: 80
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
      opacity: 1
  - id: section
    type: text
    frame:
      x: 120
      y: 70
      width: 1500
      height: 60
    body:
      paragraphs:
        - runs:
            - text: KOREAN EXPRESSIONS
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 16
            color:
              kind: token
              token: muted
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: title
    type: text
    frame:
      x: 120
      y: 150
      width: 1560
      height: 110
    body:
      paragraphs:
        - runs:
            - text: 일상어로 주문하기
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 40
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.12
          spaceAfterPt: 10
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 1000
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: border
      opacity: 1
  - id: footer
    type: text
    frame:
      x: 120
      y: 1020
      width: 1300
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 톡톡  /  아이디어 해커톤
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: page
    type: text
    frame:
      x: 1650
      y: 1020
      width: 150
      height: 60
    body:
      paragraphs:
        - runs:
            - text: 08 / 17
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.5
            color:
              kind: token
              token: muted
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 0
  - id: quoteA
    type: shape
    frame:
      x: 120
      y: 335
      width: 805
      height: 245
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: soft
      opacity: 1
  - id: quoteB
    type: shape
    frame:
      x: 985
      y: 335
      width: 815
      height: 245
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: soft
      opacity: 1
  - id: exampleA
    type: text
    frame:
      x: 160
      y: 390
      width: 725
      height: 170
    body:
      paragraphs:
        - runs:
            - text: |-
                “아아 두 잔 주세요”
                → 아이스 아메리카노 2잔
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 10
  - id: exampleB
    type: text
    frame:
      x: 1025
      y: 390
      width: 735
      height: 170
    body:
      paragraphs:
        - runs:
            - text: |-
                “뜨아 하나 주이소”
                → 따뜻한 아메리카노 1잔
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            color:
              kind: token
              token: foreground
            weight: 700
          lineHeight: 1.28
          spaceAfterPt: 10
  - id: interpretation
    type: text
    frame:
      x: 120
      y: 650
      width: 1680
      height: 160
    body:
      paragraphs:
        - runs:
            - text: 메뉴 별칭과 현재 주문 문맥을 함께 사용
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
        - runs:
            - text: 목표는 표현을 표준어로 바꾸는 것이 아니라 주문 내용을 맞추는 것
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            color:
              kind: token
              token: foreground
            weight: 400
          lineHeight: 1.28
          spaceAfterPt: 10
          bullet:
            kind: character
            character: •
