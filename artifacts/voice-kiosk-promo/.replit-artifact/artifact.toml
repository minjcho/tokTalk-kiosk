kind = "video"
videoAspectRatio = "16:9"
previewPath = "/voice-kiosk-promo/"
title = "톡톡 — 아이디어 해커톤 홍보 영상"
description = "승인된 한국어 프로젝트 소개 덱을 바탕으로 카페 점주와 방문 고객에게 AI Voice Kiosk의 가치와 주문 경험을 전달하는 제품 홍보 영상. 기존 서비스 데모와는 별도 영상입니다."
version = "1.0.0"
id = "artifacts/voice-kiosk-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/voice-kiosk-promo/" ]
localPort = 23010

[services.development]
run = "pnpm --filter @workspace/voice-kiosk-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voice-kiosk-promo", "run", "build" ]
serve = "static"
publicDir = "artifacts/voice-kiosk-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23010"
BASE_PATH = "/voice-kiosk-promo/"
